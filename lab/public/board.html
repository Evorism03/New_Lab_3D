<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доска — Order Automation</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#171d2b">
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="brand">📦 Заказы</span>
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Свернуть/развернуть меню">☰</button>
  </div>
  <a href="/" class="new-order-btn"><span class="nav-icon">➕</span><span class="label">Новый заказ</span></a>
  <nav class="sidebar-nav">
    <a href="/board.html" class="active"><span class="nav-icon">🗂</span><span class="label">Доска</span></a>
    <a href="/assembly.html"><span class="nav-icon">🔧</span><span class="label">Сборка</span></a>
    <a href="/orders.html"><span class="nav-icon">📋</span><span class="label">Все заказы</span></a>
    <a href="/serials.html"><span class="nav-icon">#️⃣</span><span class="label">Серийные номера</span></a>
    <a href="/settings.html"><span class="nav-icon">⚙️</span><span class="label">Настройки</span></a>
  </nav>
  <div class="sidebar-bottom" id="sidebar-user"></div>
</aside>
<main>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Поиск: ФИО, телефон, товар, серийник...">
  </div>
  <div class="board" id="board"></div>
</main>
</div>
<script src="/app.js"></script>
<script>
let statuses = [];
let catalog = { delivery_services: [] };
let draggedId = null;

async function load() {
  const q = document.getElementById('search').value.trim();
  const [statusesData, catalogData, orders] = await Promise.all([
    statuses.length ? Promise.resolve(statuses) : api('/api/statuses'),
    catalog.delivery_services.length ? Promise.resolve(catalog) : api('/api/catalog'),
    api('/api/orders' + (q ? `?q=${encodeURIComponent(q)}` : '')),
  ]);
  statuses = statusesData;
  catalog = catalogData;
  render(orders);
}

function render(orders) {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const visibleStatuses = statuses.filter((s) => s.id !== 'cancelled');
  for (const s of visibleStatuses) {
    const colOrders = orders.filter((o) => o.status === s.id);
    const col = el(`
      <div class="board-col" data-status="${s.id}">
        <h3><span>${s.label}</span><span>${colOrders.length}</span></h3>
        <div class="cards"></div>
      </div>
    `);
    const cardsWrap = col.querySelector('.cards');
    for (const o of colOrders) {
      const itemsSummary = summarizeItems(o.items) || '—';
      const card = el(`
        <div class="order-card" draggable="true" data-id="${o.id}">
          <div class="name">#${o.id} ${o.full_name || 'Без имени'}${o.receipts_count ? ` <span title="${o.receipts_count} чек(ов)">📎${o.receipts_count}</span>` : ''}</div>
          <div class="meta">${deliveryDot(o.delivery_service, catalog.delivery_services)}${o.delivery_service || ''} · ${o.pvz_address || ''}</div>
          <div class="meta">${itemsSummary}</div>
          <div class="total">${money(o.grand_total)}</div>
        </div>
      `);
      card.addEventListener('dragstart', () => { draggedId = o.id; card.style.opacity = '0.5'; });
      card.addEventListener('dragend', () => { card.style.opacity = '1'; });
      card.addEventListener('click', () => { window.location.href = `/order.html?id=${o.id}`; });
      cardsWrap.appendChild(card);
    }
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('dragover');
      if (draggedId == null) return;
      await api(`/api/orders/${draggedId}`, { method: 'PATCH', body: JSON.stringify({ status: s.id }) });
      draggedId = null;
      load();
    });
    board.appendChild(col);
  }
}

document.getElementById('search').addEventListener('input', () => load());
load();
</script>
</body>
</html>
