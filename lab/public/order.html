<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ — Order Automation</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#171d2b">
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="brand">📦 Заказы</span>
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Свернуть/развернуть меню">☰</button>
  </div>
  <a href="/" class="new-order-btn"><span class="nav-icon">➕</span><span class="label">Новый заказ</span></a>
  <nav class="sidebar-nav">
    <a href="/board.html"><span class="nav-icon">🗂</span><span class="label">Доска</span></a>
    <a href="/assembly.html"><span class="nav-icon">🔧</span><span class="label">Сборка</span></a>
    <a href="/orders.html"><span class="nav-icon">📋</span><span class="label">Все заказы</span></a>
    <a href="/serials.html"><span class="nav-icon">#️⃣</span><span class="label">Серийные номера</span></a>
    <a href="/settings.html"><span class="nav-icon">⚙️</span><span class="label">Настройки</span></a>
  </nav>
  <div class="sidebar-bottom" id="sidebar-user"></div>
</aside>
<main>
  <div class="card">
    <div class="toolbar">
      <h2 id="title" style="margin:0">Заказ</h2>
      <div class="spacer"></div>
      <select id="status-select" style="max-width:200px"></select>
      <button type="button" class="danger" id="delete-btn">Удалить</button>
    </div>
    <div id="external-info" class="muted" style="margin-bottom:10px"></div>
    <form id="order-form">
      <div class="grid-3 grid-order">
        <div class="field">
          <label>Номер заказа</label>
          <input name="number" maxlength="30" id="order-number">
        </div>
        <div class="field">
          <label>Транспортная компания</label>
          <select name="delivery_service" id="delivery-service"></select>
        </div>
        <div class="field">
          <label>ФИО получателя</label>
          <input name="full_name" required>
        </div>
        <div class="field">
          <label>Номер телефона</label>
          <input name="phone" required>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px">
        <label>Адрес ПВЗ <span class="muted" style="font-weight:normal">— вставьте целиком из ВК, части заполнятся сами</span></label>
        <input name="pvz_address" required placeholder="г. Москва, ул. Примерная, д. 1">
      </div>
      <div class="address-parts" id="address-parts">
        <div class="field"><label>Город</label><input data-part="city" placeholder="г. Москва"></div>
        <div class="field"><label>Улица</label><input data-part="street" placeholder="ул. Ленина"></div>
        <div class="field"><label>Дом</label><input data-part="house" placeholder="5"></div>
        <div class="field"><label>Дополнительно</label><input data-part="extra" placeholder="ТЦ, ПВЗ №…"></div>
      </div>
      <div style="margin-bottom:12px"></div>
      <div class="field">
        <label>Сумма доставки, ₽</label>
        <input name="delivery_price" type="number" step="0.01" min="0" style="max-width:200px">
      </div>

      <h3>Товары и серийные номера</h3>
      <table class="items-table" id="items-table">
        <thead>
          <tr>
            <th>Товар</th>
            <th>Модель</th>
            <th>Цвет</th>
            <th>Разъём</th>
            <th style="width:70px">Кол-во</th>
            <th style="width:110px">Цена, ₽</th>
            <th style="width:190px">Серийный номер</th>
            <th style="width:130px">Дата сборки</th>
            <th style="width:100px"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
      <div class="quick-add">
        <button type="button" class="secondary small" id="add-item">+ Добавить товар</button>
        <div id="quick-add" class="quick-add-list"></div>
      </div>

      <div class="field" style="margin-top:16px">
        <label>Заметка</label>
        <textarea name="notes" rows="2"></textarea>
      </div>

      <div class="field" style="max-width:260px">
        <label>Итого товары + доставка</label>
        <div id="preview-total" class="pill" style="font-size:16px;padding:8px 14px">0,00 ₽</div>
      </div>

      <button type="submit">Сохранить изменения</button>
    </form>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>📦 Посылка</h2>
    <div class="field" style="max-width:360px">
      <label>Коробка <span class="muted" style="font-weight:normal">(Настройки → Каталог)</span></label>
      <select id="ozon-box-template"><option value="">— вручную —</option></select>
    </div>
    <div class="grid-3" style="grid-template-columns:repeat(4,1fr)">
      <div class="field">
        <label>Вес, г</label>
        <input id="ozon-weight" type="number" min="1" step="1">
      </div>
      <div class="field">
        <label>Длина, мм</label>
        <input id="ozon-length" type="number" min="1" step="1">
      </div>
      <div class="field">
        <label>Ширина, мм</label>
        <input id="ozon-width" type="number" min="1" step="1">
      </div>
      <div class="field">
        <label>Высота, мм</label>
        <input id="ozon-height" type="number" min="1" step="1">
      </div>
    </div>
    <div class="toolbar" style="margin:0;align-items:center">
      <button type="button" class="secondary small" id="ozon-save-params">Сохранить габариты</button>
      <button type="button" class="secondary small" id="parcel-recalc">⚖ Пересчитать вес</button>
      <span id="parcel-weight-hint" class="muted" style="font-size:12px"></span>
    </div>
  </div>

  <div class="card carrier-card" id="ozon-card" style="margin-top:16px">
    <h2>🚚 Ozon Доставка</h2>
    <div class="grid-3">
      <div class="field">
        <label>ID ПВЗ Ozon <span class="muted" style="font-weight:normal">— необязательно</span></label>
        <input id="ozon-delivery-point" placeholder="подберётся по адресу ПВЗ">
      </div>
      <div class="field" style="align-self:end;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="secondary" id="ozon-find-point">Найти ПВЗ по адресу</button>
        <button type="button" class="secondary" id="ozon-check-point">Проверить ID</button>
      </div>
    </div>
    <div id="ozon-point-info" class="muted" style="margin-bottom:10px"></div>
    <div id="ozon-point-candidates" style="margin-bottom:10px"></div>

    <div id="ozon-status" style="margin-top:16px"></div>

    <div class="toolbar" style="margin-top:10px">
      <button type="button" class="secondary" id="ozon-checkout">Рассчитать доставку</button>
      <button type="button" id="ozon-create">Создать черновик в Ozon</button>
      <button type="button" class="secondary" id="ozon-refresh-status">Обновить статус</button>
      <button type="button" class="secondary" id="ozon-approve">Подтвердить к отгрузке</button>
      <a href="#" id="ozon-label-link" target="_blank"><button type="button" class="secondary">🏷 Этикетка Ozon PDF</button></a>
    </div>
  </div>

  <div class="card carrier-card" id="cdek-card" style="margin-top:16px">
    <h2>🟢 СДЭК</h2>
    <div class="grid-3">
      <div class="field">
        <label>Код ПВЗ СДЭК <span class="muted" style="font-weight:normal">— необязательно</span></label>
        <input id="cdek-point-code" placeholder="подберётся по адресу ПВЗ">
      </div>
      <div class="field" style="align-self:end;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="secondary" id="cdek-find-point">Найти ПВЗ по адресу</button>
        <button type="button" class="secondary" id="cdek-set-point">Сохранить код</button>
      </div>
    </div>
    <div id="cdek-point-info" class="muted" style="margin-bottom:10px"></div>
    <div id="cdek-point-candidates" style="margin-bottom:10px"></div>

    <div id="cdek-status" style="margin-top:16px"></div>

    <div class="toolbar" style="margin-top:10px">
      <button type="button" class="secondary" id="cdek-calculate">Рассчитать доставку</button>
      <button type="button" id="cdek-create">Создать заказ в СДЭК</button>
      <button type="button" class="secondary" id="cdek-refresh">Обновить статус</button>
      <button type="button" class="secondary" id="cdek-label">🏷 Этикетка СДЭК PDF</button>
      <button type="button" class="danger" id="cdek-cancel">Отменить заказ СДЭК</button>
    </div>
  </div>

  <div class="card" style="margin-top:16px" id="npd-card">
    <h2>🧾 Чек «Мой налог»</h2>
    <div id="npd-body" class="muted">Загрузка…</div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Чеки</h2>
    <div id="receipts-list"></div>
    <div id="receipt-dropzone" class="dropzone" style="margin-top:10px">
      <div class="muted">Перетащите файл сюда или</div>
      <input type="file" id="receipt-file" accept="image/*,.pdf" multiple>
    </div>
  </div>
</main>
</div>
<script src="/app.js"></script>
<script src="/address.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');
const itemsBody = document.getElementById('items-body');
const previewTotal = document.getElementById('preview-total');
const deliveryInput = document.querySelector('[name="delivery_price"]');
let statuses = [];
let catalog = { models: [], colors: [], connectors: [], products: [] };

// Заказы 3D-печати (item_kind === 'print', прилетают из New_Lab_3d) не привязаны к каталогу
// модель/цвет/разъём и не печатают этикетку с серийником — только материал/финиш/файл, пришедшие как есть.
function addItemRow(values = {}) {
  const isPrint = values.item_kind === 'print';
  const hidden = (name, value) => `<input type="hidden" name="${name}" value="${value || ''}">`;

  let productOptions = catalog.products
    .map((p) => `<option value="${p.label}" ${values.product_name === p.label ? 'selected' : ''}>${p.label}</option>`)
    .join('');
  if (values.product_name && !catalog.products.some((p) => p.label === values.product_name)) {
    productOptions = `<option value="${values.product_name}" selected>${values.product_name}</option>` + productOptions;
  }
  if (!productOptions) productOptions = '<option value="">— добавьте товары в Настройках → Каталог —</option>';
  const modelOptions = catalog.models
    .map((m) => `<option value="${m.id}" ${values.model_id === m.id ? 'selected' : ''}>${m.label}</option>`)
    .join('');
  const colorOptions = catalog.colors
    .map((c) => `<option value="${c.letter}" ${values.color === c.letter ? 'selected' : ''}>${c.label}</option>`)
    .join('');
  const connectorOptions = catalog.connectors
    .map((c) => `<option value="${c.letter}" ${values.connector === c.letter ? 'selected' : ''}>${c.label}</option>`)
    .join('');

  const fileLabel = values.source_file || 'файл';
  const fileLine = values.source_file_url
    ? `<div><a href="${values.source_file_url}" target="_blank" rel="noopener">📄 ${fileLabel} ⬇</a></div>`
    : values.source_file
      ? `<div class="muted">📄 ${values.source_file}</div>`
      : '';
  const productCell = isPrint
    ? `<td>
        <div><strong>${values.material || values.product_name || 'Товар'}</strong>${values.finish ? ` — ${values.finish}` : ''}</div>
        ${fileLine}
        ${hidden('product_name', values.product_name)}${hidden('item_kind', values.item_kind)}
        ${hidden('material', values.material)}${hidden('finish', values.finish)}${hidden('source_file', values.source_file)}
        ${hidden('external_ref', values.external_ref)}${hidden('source_file_url', values.source_file_url)}
      </td>
      <td class="muted">—${hidden('model_id', '')}</td>
      <td class="muted">${values.color || '—'}${hidden('color', values.color)}</td>
      <td class="muted">—${hidden('connector', '')}</td>`
    : `<td class="wide"><select name="product_name">${productOptions}</select>${hidden('item_kind', 'hardware')}</td>
      <td><select name="model_id">${modelOptions}</select></td>
      <td><div style="display:flex;align-items:center"><span class="dot color-dot"></span><select name="color">${colorOptions}</select></div></td>
      <td><div style="display:flex;align-items:center"><span class="dot connector-dot"></span><select name="connector">${connectorOptions}</select></div></td>`;

  const serialCell = isPrint
    ? `<td class="muted">не применимо${hidden('serial_number', '')}</td>`
    : `<td>
        <div style="display:flex;gap:4px">
          <input name="serial_number" placeholder="AL1R03TT0043" value="${values.serial_number || ''}">
          <button type="button" class="secondary small generate-serial" title="Сгенерировать серийник (буквы можно менять без потери номера, пока он не сохранён в заказе)">⚡</button>
        </div>
      </td>`;

  const labelCell = isPrint
    ? `<td><button type="button" class="secondary small" disabled title="Этикетка с серийником — только для физического товара">🏷 PDF</button></td>`
    : `<td>${
        values.id
          ? `<a href="/api/items/${values.id}/label.pdf" target="_blank"><button type="button" class="secondary small">🏷 PDF</button></a>`
          : `<button type="button" class="secondary small" disabled title="Сначала сохраните заказ">🏷 PDF</button>`
      }</td>`;

  const row = el(`
    <tr>
      ${productCell}
      <td><input name="quantity" type="number" min="1" value="${values.quantity || 1}"></td>
      <td><input name="price" type="number" step="0.01" min="0" value="${values.price || 0}"></td>
      ${serialCell}
      <td><input name="assembled_at" type="date" value="${values.assembled_at || ''}" title="Пусто = сегодняшняя дата на момент печати этикетки"></td>
      ${labelCell}
      <td><button type="button" class="secondary small remove-item">✕</button></td>
    </tr>
  `);
  if (values.id) row.dataset.itemId = values.id;

  if (!isPrint) {
    const colorSelect = row.querySelector('[name="color"]');
    const connectorSelect = row.querySelector('[name="connector"]');
    const colorDot = row.querySelector('.color-dot');
    const connectorDotEl = row.querySelector('.connector-dot');
    const updateDots = () => {
      colorDot.style.background = catalog.colors.find((c) => c.letter === colorSelect.value)?.swatch || '#6b7280';
      connectorDotEl.style.background = catalog.connectors.find((c) => c.letter === connectorSelect.value)?.swatch || '#6b7280';
    };
    colorSelect.addEventListener('change', updateDots);
    connectorSelect.addEventListener('change', updateDots);
    updateDots();

    row.querySelector('.generate-serial').addEventListener('click', async () => {
      const modelId = row.querySelector('[name="model_id"]').value;
      const color = row.querySelector('[name="color"]').value;
      const connector = row.querySelector('[name="connector"]').value;
      const currentSerial = row.querySelector('[name="serial_number"]').value.trim();
      try {
        const { serial } = await api('/api/serial', {
          method: 'POST',
          body: JSON.stringify({ model_id: modelId, color, connector, current_serial: currentSerial }),
        });
        const serialInput = row.querySelector('[name="serial_number"]');
        serialInput.value = serial;
        serialInput.dispatchEvent(new Event('input', { bubbles: true }));
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  }

  row.querySelector('.remove-item').addEventListener('click', () => { row.remove(); updatePreview(); });
  row.querySelectorAll('input').forEach((i) => i.addEventListener('input', updatePreview));
  itemsBody.appendChild(row);
  updatePreview();
}

function readItems() {
  return [...itemsBody.querySelectorAll('tr')].map((row) => {
    const get = (n) => row.querySelector(`[name="${n}"]`)?.value || '';
    return {
      product_name: get('product_name'),
      model_id: get('model_id'),
      color: get('color'),
      connector: get('connector'),
      quantity: Number(get('quantity')) || 1,
      price: Number(get('price')) || 0,
      serial_number: get('serial_number'),
      assembled_at: get('assembled_at'),
      item_kind: get('item_kind') || 'hardware',
      material: get('material'),
      finish: get('finish'),
      source_file: get('source_file'),
      external_ref: get('external_ref'),
      source_file_url: get('source_file_url'),
    };
  });
}

function updatePreview() {
  const goods = readItems().reduce((sum, it) => sum + it.price * it.quantity, 0);
  const delivery = Number(deliveryInput.value) || 0;
  previewTotal.textContent = money(goods + delivery);
}

document.getElementById('add-item').addEventListener('click', () => addItemRow());
deliveryInput.addEventListener('input', updatePreview);

function renderReceipts(receipts) {
  const wrap = document.getElementById('receipts-list');
  wrap.innerHTML = '';
  if (!receipts.length) {
    wrap.appendChild(el('<div class="muted" style="padding:6px 0">Чеков пока нет</div>'));
    return;
  }
  const grid = el('<div class="receipt-grid"></div>');
  for (const r of receipts) {
    const isImage = (r.mime_type || '').startsWith('image/');
    const card = el(
      isImage
        ? `
      <div class="receipt-card">
        <a href="/api/receipts/${r.id}/file" target="_blank">
          <img class="receipt-thumb" src="/api/receipts/${r.id}/file" alt="${r.original_name}">
        </a>
        <div class="receipt-card-foot">
          <span class="name" title="${r.original_name}">${r.original_name}</span>
          <button type="button" class="secondary small delete-receipt">✕</button>
        </div>
      </div>
    `
        : `
      <div class="receipt-card">
        <a class="receipt-file-icon" href="/api/receipts/${r.id}/file" target="_blank">📄</a>
        <div class="receipt-card-foot">
          <a class="name" href="/api/receipts/${r.id}/file" target="_blank" title="${r.original_name}">${r.original_name}</a>
          <button type="button" class="secondary small delete-receipt">✕</button>
        </div>
      </div>
    `
    );
    card.querySelector('.delete-receipt').addEventListener('click', async () => {
      if (!(await confirmDialog('Удалить чек?'))) return;
      await api(`/api/receipts/${r.id}`, { method: 'DELETE' });
      card.remove();
      if (!grid.children.length) renderReceipts([]);
      toast('Чек удалён', 'success');
    });
    grid.appendChild(card);
  }
  wrap.appendChild(grid);
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadReceipts(files) {
  for (const file of files) {
    try {
      const dataBase64 = await readFileAsBase64(file);
      await api(`/api/orders/${id}/receipts`, {
        method: 'POST',
        body: JSON.stringify({ filename: file.name, mimeType: file.type, dataBase64 }),
      });
    } catch (err) {
      toast(`${file.name}: ${err.message}`, 'error');
    }
  }
  const order = await api(`/api/orders/${id}`);
  renderReceipts(order.receipts || []);
}

document.getElementById('receipt-file').addEventListener('change', (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  uploadReceipts(files);
});

const dropzone = document.getElementById('receipt-dropzone');
['dragenter', 'dragover'].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  })
);
['dragleave', 'drop'].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  })
);
dropzone.addEventListener('drop', (e) => {
  const files = [...(e.dataTransfer?.files || [])];
  if (files.length) uploadReceipts(files);
});

let boxTemplates = [];
const boxSelect = document.getElementById('ozon-box-template');
const boxFields = { weight_g: 'ozon-weight', length_mm: 'ozon-length', width_mm: 'ozon-width', height_mm: 'ozon-height' };

// Подсвечиваем коробку, если габариты заказа с ней совпадают; иначе — «вручную».
const dimFields = ['length_mm', 'width_mm', 'height_mm'];
function syncBoxSelect() {
  const idx = boxTemplates.findIndex((t) => dimFields
    .every((k) => String(t[k]) === document.getElementById(boxFields[k]).value.trim()));
  boxSelect.value = idx >= 0 ? String(idx) : '';
}

async function loadBoxTemplates() {
  ({ templates: boxTemplates } = await api('/api/catalog/boxes'));
  boxTemplates.forEach((t, i) => boxSelect.appendChild(el(
    `<option value="${i}">${escapeText(t.name)} — ${t.length_mm}×${t.width_mm}×${t.height_mm} мм, коробка ${t.weight_g} г</option>`
  )));
  syncBoxSelect();
}

// Вес товаров по каталогу (вес 1 шт × количество) — из строк формы, даже несохранённых.
function itemsWeight() {
  let total = 0;
  const missing = [];
  for (const row of document.querySelectorAll('#items-table tbody tr')) {
    const name = row.querySelector('[name="product_name"]')?.value;
    const qty = Number(row.querySelector('[name="quantity"]')?.value) || 0;
    if (!name || !qty) continue;
    const w = productTemplate(name)?.weight_g || 0;
    if (w > 0) total += w * qty;
    else if (!missing.includes(name)) missing.push(name);
  }
  return { total, missing };
}

// Вес посылки = коробка + товары. Пишем в поле «Вес» и показываем разбивку.
function recalcParcelWeight() {
  const box = boxTemplates[Number(boxSelect.value)];
  const boxWeight = box ? Number(box.weight_g) || 0 : 0;
  const { total, missing } = itemsWeight();
  const hint = document.getElementById('parcel-weight-hint');
  if (!box && !total) {
    hint.textContent = 'Выберите коробку или укажите вес товаров в Настройках → Каталог.';
    return false;
  }
  document.getElementById('ozon-weight').value = boxWeight + total;
  hint.innerHTML = `${box ? `коробка ${boxWeight} г + ` : ''}товары ${total} г = <strong>${boxWeight + total} г</strong>`
    + (missing.length ? ` · <span style="color:var(--warn)">нет веса в каталоге: ${escapeText(missing.join(', '))}</span>` : '');
  return true;
}

// Ozon отдаёт сумму объектом { amount: "123.00", currency_code: "RUB" } (иногда — числом/строкой),
// а сам расчёт может лежать в posting, в postings[0] или на верхнем уровне.
function ozonAmount(value) {
  if (value == null) return null;
  const n = Number(typeof value === 'object' ? value.amount ?? value.value : value);
  return Number.isFinite(n) ? n : null;
}

function checkoutLine(checkout, price) {
  if (price) {
    const ins = price.insurance ? ` + страховка ${money(price.insurance)} (${price.percent}%)` : '';
    const days = (checkout?.posting || checkout?.postings?.[0] || checkout || {}).estimated_delivery_days;
    return `<div class="muted">Расчёт: доставка ${money(price.delivery)}${ins} = <strong>${money(price.total)}</strong>${days != null ? `, ${days} дн.` : ''}</div>`;
  }
  if (!checkout) return '';
  const posting = checkout.posting || checkout.postings?.[0] || checkout;
  const cost = ozonAmount(posting.estimated_delivery_cost ?? posting.delivery_cost ?? posting.price ?? checkout.estimated_delivery_cost);
  const days = posting.estimated_delivery_days ?? checkout.estimated_delivery_days;
  const parts = [cost != null ? money(cost) : null, days != null ? `${days} дн.` : null].filter(Boolean);
  return parts.length ? `<div class="muted">Расчёт: ${parts.join(', ')}</div>` : '';
}

function escapeText(value) {
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

function renderCdek(order) {
  const sh = order.cdek_shipment || {};
  document.getElementById('cdek-point-code').value = order.cdek_pvz_code || '';
  document.getElementById('cdek-point-info').textContent = sh.point?.code
    ? `ПВЗ: ${sh.point.full_address}${sh.point.type === 'POSTAMAT' ? ' (постамат)' : ''}`
    : '';
  const lines = [];
  if (sh.uuid) {
    lines.push(`<div><strong>Номер СДЭК (трек):</strong> ${escapeText(sh.cdek_number || 'присваивается…')}${sh.status_name ? ` <span class="pill">${escapeText(sh.status_name)}</span>` : ''}</div>`);
  } else {
    lines.push(`<span class="muted">Заказ в СДЭК ещё не создан.${sh.cancelled_at ? ' Предыдущий заказ отменён.' : ''}</span>`);
  }
  if (sh.errors?.length) lines.push(`<div style="color:var(--danger)">СДЭК отклонил заказ: ${escapeText(sh.errors.join('; '))}</div>`);
  if (sh.price) {
    const p = sh.price;
    const ins = p.insurance ? ` + страховка ${money(p.insurance)}` : '';
    const days = p.period_min != null ? `, ${p.period_min === p.period_max ? p.period_min : `${p.period_min}–${p.period_max}`} раб. дн.` : '';
    lines.push(`<div class="muted">Расчёт (тариф ${escapeText(p.tariff_code)}): доставка ${money(p.delivery)}${ins} = <strong>${money(p.total)}</strong>${days}</div>`);
  }
  document.getElementById('cdek-status').innerHTML = lines.join('');
  const created = Boolean(sh.uuid);
  document.getElementById('cdek-create').disabled = created && !sh.errors?.length;
  for (const btnId of ['cdek-refresh', 'cdek-label', 'cdek-cancel']) document.getElementById(btnId).disabled = !created;
}

// PDF открываем в новой вкладке; ошибку показываем уведомлением, а не JSON во вкладке.
async function openPdf(url) {
  const win = window.open('', '_blank');
  try {
    const res = await fetch(url, { credentials: 'same-origin' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    const blobUrl = URL.createObjectURL(await res.blob());
    if (win) win.location.href = blobUrl; else window.location.href = blobUrl;
  } catch (err) {
    if (win) win.close();
    toast(err.message, 'error');
  }
}

});

async function load() {
  [statuses, catalog] = await Promise.all([api('/api/statuses'), api('/api/catalog')]);
  renderQuickAdd(document.getElementById('quick-add'), addItemRow);
  const sel = document.getElementById('status-select');
  const deliverySelect = document.getElementById('delivery-service');
  for (const s of catalog.delivery_services) {
    deliverySelect.appendChild(el(`<option value="${s.label}">${s.label}</option>`));
  }

  const order = await api(`/api/orders/${id}`);
  document.getElementById('title').textContent = `Заказ #${order.display_number}`;
  window.CURRENT_ORDER_ID = order.id;
  document.getElementById('order-form').number.value = order.number || '';
  document.getElementById('order-form').number.placeholder = String(order.id);
  // «Печать» — только для заказов с сайта (сервер тоже это проверяет).
  for (const s of statuses) {
    if (s.id === 'printing' && order.source_tag !== 'site' && order.status !== 'printing') continue;
    sel.appendChild(el(`<option value="${s.id}">${s.label}</option>`));
  }
  const infoEl = document.getElementById('external-info');
  if (order.source === 'new_lab_3d') {
    const paidPill = order.payment_status === 'paid'
      ? '<span class="pill delivered">Оплачен</span>'
      : '<span class="pill new">Не оплачен</span>';
    infoEl.innerHTML = `
      ${tagBadge(order)} Из New_Lab_3d ${paidPill}
      ${order.customer_email ? ` · ${order.customer_email}` : ''}
      ${order.shipping_address ? ` · ${order.shipping_address}` : ''}
    `;
  } else {
    infoEl.innerHTML = `${tagBadge(order)} Создан в CRM`;
  }
  sel.value = order.status;
  const form = document.getElementById('order-form');
  form.delivery_service.value = order.delivery_service || 'СДЭК';
  form.full_name.value = order.full_name || '';
  form.phone.value = order.phone || '';
  form.pvz_address.value = order.pvz_address || '';
  addressFields.refresh();
  form.delivery_price.value = order.delivery_price || 0;
  form.notes.value = order.notes || '';
  order.items.forEach((it) => addItemRow(it));
  if (!order.items.length) addItemRow();
  updatePreview();
  renderReceipts(order.receipts || []);

  document.getElementById('ozon-weight').value = order.weight_g || '';
  document.getElementById('ozon-length').value = order.length_mm || '';
  document.getElementById('ozon-width').value = order.width_mm || '';
  document.getElementById('ozon-height').value = order.height_mm || '';
  document.getElementById('ozon-delivery-point').value = order.ozon_delivery_point_id || '';
  renderOzonStatus(order.ozon_shipment);
  loadBoxTemplates().catch((err) => toast(err.message, 'error'));
  renderCdek(order);
  syncCarrierCards();
  renderNpd(order);

  sel.addEventListener('change', async () => {
    await api(`/api/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
  });
}

document.getElementById('order-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = {
    delivery_service: form.delivery_service.value,
    full_name: form.full_name.value,
    phone: form.phone.value,
    number: form.number.value.trim(),
    pvz_address: form.pvz_address.value,
    delivery_price: Number(form.delivery_price.value) || 0,
    notes: form.notes.value,
    items: readItems(),
  };
  try {
    const order = await api(`/api/orders/${id}`, { method: 'PATCH', body: JSON.stringify(data) });
    document.getElementById('title').textContent = `Заказ #${order.display_number}`;
    renderNpd(order);
    const pointId = document.getElementById('ozon-delivery-point').value.trim();
    if (pointId !== (order.ozon_delivery_point_id || '')) await saveOzonPoint(pointId);
    const cdekCode = document.getElementById('cdek-point-code').value.trim();
    if (cdekCode !== (order.cdek_pvz_code || '')) {
      renderCdek(await api(`/api/orders/${id}/cdek/point`, { method: 'PUT', body: JSON.stringify({ code: cdekCode }) }));
    }
    itemsBody.innerHTML = '';
    order.items.forEach((it) => addItemRow(it));
    if (!order.items.length) addItemRow();
    updatePreview();
    toast('Сохранено', 'success');
  } catch (err) {
    toast(err.message, 'error');
  }
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!(await confirmDialog('Удалить заказ безвозвратно?'))) return;
  await api(`/api/orders/${id}`, { method: 'DELETE' });
  window.location.href = '/orders.html';
});

load();
</script>
</body>
</html>
