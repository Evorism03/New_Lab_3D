<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Order Automation</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#171d2b">
</head>
<body>
<div class="login-page">
  <div class="card login-card">
    <h1>📦 Заказы</h1>
    <p class="muted">Вход для сотрудников</p>
    <form id="login-form">
      <div class="field">
        <label>Логин</label>
        <input name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input name="password" type="password" required autocomplete="current-password">
      </div>
      <div id="error" class="muted" style="color:var(--danger);display:none;margin-bottom:12px"></div>
      <button type="submit" style="width:100%">Войти</button>
    </form>
  </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: form.username.value, password: form.password.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка входа');
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
