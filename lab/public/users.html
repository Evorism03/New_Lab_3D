<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пользователи — Order Automation</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#171d2b">
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="brand">📦 Заказы</span>
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Свернуть/развернуть меню">☰</button>
  </div>
  <a href="/" class="new-order-btn"><span class="nav-icon">➕</span><span class="label">Новый заказ</span></a>
  <nav class="sidebar-nav">
    <a href="/board.html"><span class="nav-icon">🗂</span><span class="label">Доска</span></a>
    <a href="/assembly.html"><span class="nav-icon">🔧</span><span class="label">Сборка</span></a>
    <a href="/orders.html"><span class="nav-icon">📋</span><span class="label">Все заказы</span></a>
    <a href="/serials.html"><span class="nav-icon">#️⃣</span><span class="label">Серийные номера</span></a>
    <a href="/ozon.html"><span class="nav-icon">🚚</span><span class="label">Ozon Доставка</span></a>
  </nav>
  <div class="sidebar-bottom" id="sidebar-user"></div>
</aside>
<main>
  <div class="toolbar">
    <h2 style="margin:0">Пользователи</h2>
    <div class="spacer"></div>
    <button type="button" id="add-user">+ Добавить сотрудника</button>
  </div>
  <div class="card">
    <table class="orders-table" id="table">
      <thead>
        <tr>
          <th>Логин</th>
          <th>Роль</th>
          <th>Создан</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
</div>
<script src="/app.js"></script>
<script>
let me = null;

function userRow(u) {
  const row = el(`
    <tr>
      <td>${u.username}</td>
      <td>${u.role === 'admin' ? 'Администратор' : 'Сотрудник'}</td>
      <td>${new Date(u.created_at).toLocaleDateString('ru-RU')}</td>
      <td style="text-align:right">
        <button type="button" class="secondary small reset-pw">Сменить пароль</button>
        ${u.id !== me.id ? '<button type="button" class="danger small delete-user">Удалить</button>' : ''}
      </td>
    </tr>
  `);
  row.querySelector('.reset-pw').addEventListener('click', async () => {
    const password = prompt(`Новый пароль для «${u.username}» (минимум 6 символов):`);
    if (!password) return;
    try {
      await api(`/api/users/${u.id}`, { method: 'PATCH', body: JSON.stringify({ password }) });
      toast('Пароль обновлён', 'success');
    } catch (err) {
      toast(err.message, 'error');
    }
  });
  const deleteBtn = row.querySelector('.delete-user');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', async () => {
      if (!(await confirmDialog(`Удалить пользователя «${u.username}»?`))) return;
      try {
        await api(`/api/users/${u.id}`, { method: 'DELETE' });
        row.remove();
        toast('Пользователь удалён', 'success');
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  }
  return row;
}

async function load() {
  me = await api('/api/auth/me');
  if (me.role !== 'admin') {
    document.querySelector('main').innerHTML = '<div class="card">Доступно только администратору.</div>';
    return;
  }
  const users = await api('/api/users');
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  for (const u of users) tbody.appendChild(userRow(u));
}

document.getElementById('add-user').addEventListener('click', async () => {
  const username = prompt('Логин нового сотрудника:');
  if (!username) return;
  const password = prompt('Пароль (минимум 6 символов):');
  if (!password) return;
  const isAdmin = confirmDialog ? await confirmDialog(`Дать «${username}» права администратора?`, { okLabel: 'Да, админ', danger: false }) : false;
  try {
    await api('/api/users', {
      method: 'POST',
      body: JSON.stringify({ username, password, role: isAdmin ? 'admin' : 'employee' }),
    });
    toast('Сотрудник добавлен', 'success');
    load();
  } catch (err) {
    toast(err.message, 'error');
  }
});

load();
</script>
</body>
</html>
