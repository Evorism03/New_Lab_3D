<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сборка — Order Automation</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#171d2b">
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="brand">📦 Заказы</span>
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Свернуть/развернуть меню">☰</button>
  </div>
  <a href="/" class="new-order-btn"><span class="nav-icon">➕</span><span class="label">Новый заказ</span></a>
  <nav class="sidebar-nav">
    <a href="/board.html"><span class="nav-icon">🗂</span><span class="label">Доска</span></a>
    <a href="/assembly.html" class="active"><span class="nav-icon">🔧</span><span class="label">Сборка</span></a>
    <a href="/orders.html"><span class="nav-icon">📋</span><span class="label">Все заказы</span></a>
    <a href="/serials.html"><span class="nav-icon">#️⃣</span><span class="label">Серийные номера</span></a>
    <a href="/warehouse.html"><span class="nav-icon">🏬</span><span class="label">Склад</span></a>
    <a href="/stats.html"><span class="nav-icon">📊</span><span class="label">Статистика</span></a>
    <a href="/accounting.html" data-admin-only hidden><span class="nav-icon">💰</span><span class="label">Бухгалтерия</span></a>
    <a href="/settings.html"><span class="nav-icon">⚙️</span><span class="label">Настройки</span></a>
  </nav>
  <div class="sidebar-bottom" id="sidebar-user"></div>
</aside>
<main>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Поиск: товар, серийник, клиент...">
    <div class="spacer"></div>
  </div>
  <div class="card" id="materials" style="margin-bottom:14px" hidden></div>
  <div id="tbody" class="list"></div>
  <div id="empty" class="card empty-state" style="display:none">Собирать пока нечего.</div>
</main>
</div>
<script src="/app.js"></script>
<script>
let statuses = [];
let catalog = { models: [], colors: [], connectors: [] };
let all = [];

// На «Сборке» — только заказы из колонки «Собрать» на доске.
const ASSEMBLY_STATUS = 'to_collect';

function modelLabel(id) { return catalog.models.find((m) => m.id === id)?.label || id || ''; }
function colorLabel(letter) { return catalog.colors.find((c) => c.letter === letter)?.label || letter || ''; }
function connectorLabel(letter) { return catalog.connectors.find((c) => c.letter === letter)?.label || letter || ''; }

async function load() {
  [statuses, catalog, all] = await Promise.all([api('/api/statuses'), api('/api/catalog'), api('/api/serials')]);
  render();
  loadMaterials().catch(() => {});
}

// Сколько компонентов со склада нужно на всё, что сейчас в «Собрать», и хватает ли остатков.
async function loadMaterials() {
  const m = await api(`/api/stock/needs?statuses=${ASSEMBLY_STATUS}`);
  const box = document.getElementById('materials');
  const fmt = (n) => Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
  box.hidden = !m.components.length && !m.unmatched.length;
  if (box.hidden) return;
  box.innerHTML = `
    <h2 style="margin-top:0">🧩 Материалы на сборку ${m.components.length
      ? (m.enough ? '<span class="pos" style="font-size:14px">— всего хватает</span>' : '<span class="neg" style="font-size:14px">— не всего хватает</span>')
      : ''}</h2>
    ${m.components.map((c) => `
      <div class="wh-need-row">
        <span>${escapeHtml(c.name)}</span>
        <span style="white-space:nowrap">нужно <b>${fmt(c.need)}</b> · есть ${fmt(c.qty)} ${escapeHtml(c.unit)}
          ${c.short ? `<b class="neg">· не хватает ${fmt(c.short)}</b>` : '<span class="pos">✓</span>'}</span>
      </div>`).join('')}
    ${m.unmatched.length ? `<div class="wh-warn" style="margin:10px 0 0">⚠️ Не посчитаны — у товара не задан состав (Настройки → Каталог → 🧩):
      ${m.unmatched.map((u) => `<b>${escapeHtml(u.product_name)}</b> × ${fmt(u.qty)}`).join(', ')}</div>` : ''}
    <div style="margin-top:8px"><a href="/warehouse.html">Открыть склад →</a></div>`;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = all.filter((r) => r.status === ASSEMBLY_STATUS);
  if (q) {
    rows = rows.filter((r) =>
      [r.product_name, r.serial_number, r.full_name, r.phone, colorLabel(r.color), connectorLabel(r.connector), modelLabel(r.model_id)]
        .join(' ')
        .toLowerCase()
        .includes(q)
    );
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';

  for (const r of rows) {
    const row = el(`
      <div class="list-card">
        <div class="lc-main">
          <div class="lc-head">
            <span class="lc-title">${escapeHtml(r.product_name || 'Товар')}</span>
            ${itemChips(r)}
          </div>
          <div class="lc-line"><span class="serial">${escapeHtml(r.serial_number || 'серийник не задан')}</span></div>
          <div class="lc-sub">
            <a href="/order.html?id=${r.order_id}">Заказ #${escapeHtml(r.order_number)}</a>
            <span>${escapeHtml(r.full_name || '')}</span>
          </div>
        </div>
        <div class="lc-side lc-actions">
          <label class="lc-field">Дата сборки
            <input type="date" value="${r.assembled_at || ''}" title="Пусто = подставится сегодняшняя дата при скачивании этикетки">
          </label>
          ${
            r.serial_number
              ? '<button type="button" class="secondary label-btn">🏷 Этикетка PDF</button>'
              : '<button type="button" class="secondary label-btn" disabled title="Сначала сгенерируйте серийник в заказе">🏷 Этикетка PDF</button>'
          }
        </div>
      </div>
    `);

    const dateInput = row.querySelector('input[type="date"]');
    dateInput.addEventListener('change', async () => {
      try {
        await api(`/api/items/${r.item_id}`, {
          method: 'PATCH',
          body: JSON.stringify({ assembled_at: dateInput.value }),
        });
        r.assembled_at = dateInput.value;
        toast('Дата сборки сохранена', 'success');
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    const pdfBtn = row.querySelector('.label-btn');
    if (r.serial_number) {
      pdfBtn.addEventListener('click', () => {
        window.open(`/api/items/${r.item_id}/label.pdf`, '_blank');
        // Дата могла проставиться на сервере автоматически — подтянем её через секунду.
        setTimeout(async () => {
          const fresh = await api('/api/serials');
          const match = fresh.find((x) => x.item_id === r.item_id);
          if (match) {
            r.assembled_at = match.assembled_at;
            dateInput.value = match.assembled_at || '';
          }
        }, 800);
      });
    }

    tbody.appendChild(row);
  }
}

document.getElementById('search').addEventListener('input', render);
load();
</script>
</body>
</html>
